name: Deploy Portfolio to Combell

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy via FTPS
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Build frontend (Vite)
        run: npm run build

      - name: 5. Generate secure config.local.php on the fly
        run: |
          mkdir -p dist/api
          cat << 'EOF' > dist/api/config.local.php
          <?php
          return [
              'GEMINI_API_KEY' => '${{ secrets.GEMINI_API_KEY }}',
          ];
          EOF
          chmod 600 dist/api/config.local.php

      - name: 6. Deploy to Combell via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          local_path: './dist/*'
          remote_path: 'www'
          sftpArgs: '-o ConnectTimeout=30'
